[package]
name = "yosys_bencher"
version = "0.1.0"
edition = "2024"

[dependencies]
contracts = "0.6.11"
getset = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
sha2 = "0.10.9"
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
log = "0.4"

rusqlite = { version = "0.40.2", features = ["bundled"] }
inventory = "0.3.25"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }

yosys-bencher-ui-types = { path = "crates/ui-types" }

[workspace]
members = ["crates/ui-types"]
