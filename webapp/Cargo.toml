[package]
name = "benchmark-results-web"
version = "0.1.0"
edition = "2024"

[dependencies]
yosys-bench-ui-types = { path = "../crates/ui-types" }
dioxus = { version = "0.7.7", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
yosys_bench = { path = ".." }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server"]

[workspace]
